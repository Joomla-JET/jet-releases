services:

  joomla:
    build:
      context: .
      args:
        WWWUSER: ${WWWUSER}
        WWWGROUP: ${WWWGROUP}
    #image: joomla
    restart: always
    ports:
      - "8080:80"
    environment:
      JOOMLA_DB_HOST: db
      JOOMLA_DB_USER: joomla
      JOOMLA_DB_PASSWORD: examplepass
      JOOMLA_DB_NAME: joomla_db
      JOOMLA_SITE_NAME: Joomla
      JOOMLA_ADMIN_USER: Joomla Hero
      JOOMLA_ADMIN_USERNAME: joomla
      JOOMLA_ADMIN_PASSWORD: joomla@secured
      JOOMLA_ADMIN_EMAIL: joomla@example.com
    volumes:
      - ./joomla_data:/var/www/html
      - ./repos/templates/cassiopeia_joomlaboot:/var/www/html/templates/cassiopeia_joomlaboot
      - ./repos/modules/mod_joomlaboot_carousel:/var/www/html/modules/mod_joomlaboot_carousel
      - ./repos/modules/mod_joomlaboot_faq:/var/www/html/modules/mod_joomlaboot_faq
    networks:
      - joomla_network

  db:
    image: mysql:8.0
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: joomla_db
      MYSQL_USER: joomla
      MYSQL_PASSWORD: examplepass
      MYSQL_RANDOM_ROOT_PASSWORD: '1'
    volumes:
      - db_data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d
    networks:
      - joomla_network

volumes:
  joomla_data:
  db_data:

networks:
  joomla_network:
